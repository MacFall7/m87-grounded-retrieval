name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # No Postgres service and no model download here on purpose. The unit suite has
      # to be runnable by anyone with only Python, otherwise it stops being run.
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          # psycopg2-binary is needed to import the store module, not to reach a
          # server. sentence-transformers is deliberately absent: the suite uses the
          # hashing backend, so CI downloads no weights.
          python -m pip install pytest numpy psycopg2-binary

      - name: Run the non-integration suite
        run: python -m pytest -m "not integration" -q
