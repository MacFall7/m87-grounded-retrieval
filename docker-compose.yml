services:
  db:
    image: pgvector/pgvector:pg16
    container_name: grounded-retrieval-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    # Ingest connects immediately after `docker compose up`, and Postgres accepts TCP
    # before it is ready to serve. Without this check the first run fails on a race.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  pgdata:
